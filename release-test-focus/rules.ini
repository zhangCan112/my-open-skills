# rules.ini — mechanical judgment rules for release-test-focus (edit here)
# Read by Python standard library only (configparser). No third-party deps.
# The focus-generation rules in SKILL.md are semantic (done by the LLM) and
# do NOT live here.

# 1) Priority mapping: team's real priority name -> equivalent tier + weight
#    Format:  <real-name> = <tier>:<weight>
#    Replace the left-hand keys with your real values. Tier is usually P0..P3,
#    weight decreasing. Case-insensitive (both the ticket's `priority` and the
#    key here are lower-cased before comparison).
[priority_mapping]
blocker = P0:100
critical = P0:100
major = P1:70
minor = P2:30
trivial = P3:10
# Example: if you use High / Medium / Low, replace the above with:
# high = P0:100
# medium = P1:70
# low = P2:30

# 2) Must-test conditions (any one sends a ticket to the must-test table)
[must_test]
# A: weight >= this value (i.e. P0 / P1)
priority_weight_min = 70
# B: these sources are always must-test (comma-separated); deps have wide regression surface
sources = dependency
# C: description containing any keyword -> breaking change (comma-separated)
description_keywords = breaking,breaking change,incompatible,removed,deleted,deprecated,deprecate

# 3) Must-test table sort is fixed: hit-count -> weight -> type -> source.
#    The two tables below set the order of `type` and `source` (lower first).
#    Keys must match the case of ticket `type` / `source` values.
[type_order]
Story = 1
Defect = 2

[source_order]
main = 1
dependency = 2

# 4) Overall risk level (overview; evaluated high -> low, first match wins)
[risk]
# exists weight >= this -> 🔴 High
high_weight = 100
# exists dependency with weight >= this -> 🟠 Medium-high (breaking change also triggers 🟠)
med_high_dependency_weight = 70
# exists weight >= this (and not high / medium-high) -> 🟡 Medium
med_weight = 70
# all weights <= this -> 🟢 Low
low_weight_max = 30

# 5) Document navigation
[nav]
enable_toc = true
ticket_anchor_prefix = t-
back_to_top = true
