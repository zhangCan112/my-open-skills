<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" font-family="Segoe UI, PingFang SC, sans-serif">
  <rect width="1100" height="660" fill="#181818"/>
  <text x="24" y="34" fill="#ffffff" font-size="16" font-weight="600">01 · 整体布局骨架 — 三栏工作台(方案 A)</text>
  <text x="24" y="54" fill="#9d9d9d" font-size="12">扩展寄生在 VS Code Workbench 内。区域尺寸标注为设计值;侧栏宽度由用户拖拽控制(260–500)。</text>

  <!-- workbench frame -->
  <rect x="40" y="76" width="1020" height="486" fill="#1e1e1e" stroke="#3c3c3c"/>
  <!-- activity bar -->
  <rect x="40" y="76" width="48" height="486" fill="#333333"/>
  <rect x="40" y="120" width="48" height="48" fill="#4a4a4a"/>
  <rect x="40" y="120" width="3" height="48" fill="#ffffff"/>
  <text x="64" y="148" fill="#ffffff" font-size="14" text-anchor="middle">⚖</text>
  <text x="64" y="100" fill="#9d9d9d" font-size="10" text-anchor="middle">48px</text>
  <!-- sidebar -->
  <rect x="88" y="76" width="300" height="486" fill="#252526"/>
  <text x="100" y="96" fill="#e7e7e7" font-size="12" font-weight="600">⚖ 配置对比</text>
  <text x="376" y="96" fill="#cccccc" font-size="11" text-anchor="end">14 处差异</text>
  <rect x="88" y="104" width="300" height="1" fill="#3c3c3c"/>
  <text x="100" y="122" fill="#9d9d9d" font-size="10">视图 1「差异」TreeView</text>
  <g font-size="11" fill="#cccccc">
    <text x="104" y="144">▾ ⚙ application.yaml</text><text x="360" y="144" fill="#9d9d9d" text-anchor="end">12</text>
    <text x="124" y="162" fill="#e2c08d">≠</text><text x="138" y="162">值不同</text><text x="360" y="162" fill="#9d9d9d" text-anchor="end">4</text>
    <text x="152" y="180" fill="#e2c08d">≠</text><text x="166" y="180">port</text><text x="360" y="180" fill="#9d9d9d" text-anchor="end">8080 → 8081</text>
    <text x="124" y="198" fill="#d18616">⇄</text><text x="138" y="198">类型不同</text><text x="360" y="198" fill="#9d9d9d" text-anchor="end">2</text>
    <text x="124" y="216" fill="#e0704f">−</text><text x="138" y="216">仅在 A</text><text x="360" y="216" fill="#9d9d9d" text-anchor="end">2</text>
    <text x="104" y="234">▾ ⚙ .env</text><text x="360" y="234" fill="#9d9d9d" text-anchor="end">4</text>
  </g>
  <rect x="88" y="300" width="300" height="1" fill="#3c3c3c"/>
  <text x="100" y="318" fill="#9d9d9d" font-size="10">视图 2「对比规则」TreeView(可折叠)</text>
  <g font-size="11" fill="#cccccc">
    <text x="104" y="338"><tspan fill="#81b88b">⇄</tspan> 文件配对 · .env.dev ⇄ .env.prod.example</text>
    <text x="112" y="358"><tspan fill="#9d9d9d">开</tspan></text>
    <text x="104" y="378"><tspan fill="#b180d7">≈</tspan> 值等价 · Redis 主机映射</text>
  </g>
  <rect x="96" y="392" width="24" height="11" rx="6" fill="#2ea043"/><circle cx="114" cy="398" r="4" fill="#ffffff"/>
  <text x="100" y="430" fill="#3794ff" font-size="11">+ 添加规则…   </text>
  <text x="190" y="430" fill="#3794ff" font-size="11">&lt;/&gt; 编辑源码</text>
  <!-- editor -->
  <rect x="388" y="76" width="672" height="24" fill="#252526"/>
  <rect x="388" y="76" width="180" height="24" fill="#1e1e1e"/>
  <text x="398" y="93" fill="#e7e7e7" font-size="11">对比报告 · 2 个文件</text>
  <rect x="388" y="100" width="672" height="1" fill="#3c3c3c"/>
  <g font-size="11" fill="#cccccc">
    <rect x="404" y="116" width="64" height="16" rx="8" fill="none" stroke="#0e639c"/><text x="436" y="128" text-anchor="middle" fill="#ffffff" font-size="10">全部 14</text>
    <rect x="476" y="116" width="70" height="16" rx="8" fill="none" stroke="#454545"/><text x="511" y="128" text-anchor="middle" fill="#cccccc" font-size="10">≠ 值不同 6</text>
    <rect x="554" y="116" width="64" height="16" rx="8" fill="none" stroke="#454545"/><text x="586" y="128" text-anchor="middle" fill="#cccccc" font-size="10">⇄ 类型 2</text>
  </g>
  <g font-size="11" fill="#cccccc">
    <text x="404" y="162">≠</text><text x="436" y="162" class="mono">server.port</text><text x="560" y="162" fill="#9d9d9d">application.yaml</text><text x="680" y="162" fill="#9d9d9d">8080</text><text x="800" y="162" fill="#9d9d9d">8081</text>
    <text x="404" y="184">⇄</text><text x="436" y="184" class="mono">database.pool.maxSize</text><text x="560" y="184" fill="#9d9d9d">application.yaml</text><text x="680" y="184" fill="#9d9d9d">20</text><text x="800" y="184" fill="#9d9d9d">"20"</text>
    <text x="404" y="206">−</text><text x="436" y="206" class="mono">database.pool.minIdle</text><text x="560" y="206" fill="#9d9d9d">application.yaml</text><text x="680" y="206" fill="#9d9d9d">5</text><text x="800" y="206" fill="#9d9d9d">— 不存在 —</text>
  </g>
  <!-- status bar -->
  <rect x="40" y="539" width="1020" height="23" fill="#007acc"/>
  <text x="52" y="555" fill="#ffffff" font-size="11">⎇ main*</text>
  <text x="130" y="555" fill="#ffffff" font-size="11" font-weight="600">⇄ 14 处差异</text>

  <!-- dimension marks -->
  <g stroke="#ffd43b" fill="none">
    <path d="M88 580 h300"/><path d="M88 574 v12"/><path d="M388 574 v12"/>
    <path d="M1076 76 v486"/><path d="M1070 76 h12"/><path d="M1070 562 h12"/>
  </g>
  <text x="238" y="596" fill="#ffd43b" font-size="11" text-anchor="middle">侧栏 300px(用户可拖 260–500)</text>
  <text x="1084" y="320" fill="#ffd43b" font-size="11" transform="rotate(90 1084 320)" text-anchor="middle">编辑区自适应</text>
  <g font-size="11" fill="#cccccc">
    <text x="40" y="630">① 活动栏入口(24×24 图标 + badge)</text>
    <text x="250" y="630">② 侧栏·差异视图(行高 22)</text>
    <text x="460" y="630">③ 侧栏·规则视图(可折叠)</text>
    <text x="650" y="630">④ 编辑器·报告(Webview,二期)</text>
    <text x="860" y="630">⑤ 状态栏 ⇄ N 处差异(点击 reveal)</text>
  </g>
</svg>
