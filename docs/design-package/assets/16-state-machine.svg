<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600" font-family="Segoe UI, PingFang SC, sans-serif">
  <rect width="1100" height="600" fill="#181818"/>
  <text x="24" y="34" fill="#ffffff" font-size="16" font-weight="600">16 · 视图状态机(State Machine)</text>
  <text x="24" y="54" fill="#9d9d9d" font-size="12">全局比较任务单飞行(E20);Error 分文件级(降级继续)与全局级(中断)。</text>

  <!-- states -->
  <g font-size="13" font-weight="600" text-anchor="middle">
    <rect x="60" y="100" width="150" height="54" rx="8" fill="#252526" stroke="#3c3c3c"/>
    <text x="135" y="123" fill="#e7e7e7">Idle 空闲</text>
    <text x="135" y="142" fill="#9d9d9d" font-size="10.5" font-weight="400">Welcome 视图 · 无 DiffResult</text>

    <rect x="320" y="100" width="150" height="54" rx="8" fill="#252526" stroke="#3c3c3c"/>
    <text x="395" y="123" fill="#e7e7e7">Picking</text>
    <text x="395" y="142" fill="#9d9d9d" font-size="10.5" font-weight="400">对话框/QuickPick 中</text>

    <rect x="580" y="100" width="160" height="54" rx="8" fill="#2a2313" stroke="#6b5a1e"/>
    <text x="660" y="123" fill="#ffd97a">Comparing</text>
    <text x="660" y="142" fill="#ffd97a" font-size="10.5" font-weight="400">withProgress 可取消</text>

    <rect x="850" y="100" width="170" height="54" rx="8" fill="#1a3325" stroke="#2ea043"/>
    <text x="935" y="123" fill="#81b88b">Ready</text>
    <text x="935" y="142" fill="#81b88b" font-size="10.5" font-weight="400">树+报告+badge 渲染</text>

    <rect x="850" y="260" width="170" height="54" rx="8" fill="#3a2f14" stroke="#6b5a1e"/>
    <text x="935" y="283" fill="#ffd97a">Stale 过期</text>
    <text x="935" y="302" fill="#ffd97a" font-size="10.5" font-weight="400">mtime &gt; generatedAt</text>

    <rect x="320" y="260" width="180" height="54" rx="8" fill="#331414" stroke="#f14c4c"/>
    <text x="410" y="283" fill="#f14c4c">Error</text>
    <text x="410" y="302" fill="#f14c4c" font-size="10.5" font-weight="400">文件级降级 / 全局中断</text>
  </g>

  <!-- arrows -->
  <g stroke="#3794ff" fill="none">
    <path d="M210 127 h104"/><polygon points="316,127 308,123 308,131" fill="#3794ff"/>
    <path d="M470 127 h104"/><polygon points="576,127 568,123 568,131" fill="#3794ff"/>
    <path d="M740 127 h104"/><polygon points="846,127 838,123 838,131" fill="#3794ff"/>
    <path d="M935 154 v100"/><polygon points="935,258 931,250 939,250" fill="#3794ff"/>
    <path d="M935 314 c0 60 -300 60 -430 8"/><polygon points="503,320 512,322 507,314" fill="#3794ff"/>
    <path d="M320 287 h-110 c-40 0 -50 -100 -95 -130"/><polygon points="113,155 112,164 120,160" fill="#3794ff"/>
  </g>
  <g font-size="10.5" fill="#9d9d9d">
    <text x="216" y="120">选项目对</text>
    <text x="484" y="120">确认文件集</text>
    <text x="770" y="120">完成判定</text>
    <text x="946" y="210">源文件改动</text>
    <text x="640" y="345">刷新(re-compare → Ready)</text>
    <text x="130" y="240" transform="rotate(-38 130 240)">解析失败/IO 错误</text>
  </g>

  <!-- ready internals -->
  <rect x="60" y="380" width="960" height="180" fill="#202020" stroke="#3c3c3c"/>
  <text x="76" y="404" fill="#e7e7e7" font-size="12" font-weight="600">Ready 内部子状态(并存,不互斥)</text>
  <g font-size="11.5" fill="#cccccc">
    <text x="76" y="430">· 树分组模式:file ⇄ status(记忆上次选择)</text>
    <text x="76" y="452">· 树选中:null → 叶子(diff 已打开);不会自动清空</text>
    <text x="76" y="474">· 报告过滤:all / mod / type / onlya / onlyb / equ / ign + 搜索词(会话内保留)</text>
    <text x="76" y="496">· 规则开关集:任意组合,实时重算(纯函数,不产生新的比较任务)</text>
    <text x="76" y="518">· Webview 生命周期:切后台销毁 DOM → getState 恢复过滤/滚动(官方推荐,勿用 retainContextWhenHidden)</text>
  </g>
  <text x="76" y="548" fill="#9d9d9d" font-size="11">规则开关产生的"重算"不改变 generatedAt(源文件没变,结果不算过期)。</text>
</svg>
