<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" font-family="Segoe UI, PingFang SC, sans-serif">
  <rect width="1100" height="660" fill="#181818"/>
  <text x="24" y="34" fill="#ffffff" font-size="16" font-weight="600">09 · 色板 — Dark+(tokens 参考值;实现绑定 --vscode-*,INV-1)</text>
  <text x="24" y="54" fill="#9d9d9d" font-size="12">每格:角色名 / 绑定的 VS Code token / 参考值。完整机读版:tokens/design-tokens.json</text>

  <g font-size="11">
    <!-- row 1: surfaces -->
    <rect x="40" y="80" width="150" height="70" fill="#1e1e1e" stroke="#3c3c3c"/><text x="50" y="102" fill="#cccccc">editor.background</text><text x="50" y="120" fill="#9d9d9d">editor.background</text><text x="50" y="138" fill="#9d9d9d">#1e1e1e</text>
    <rect x="200" y="80" width="150" height="70" fill="#252526" stroke="#3c3c3c"/><text x="210" y="102" fill="#cccccc">side.background</text><text x="210" y="120" fill="#9d9d9d">sideBar.background</text><text x="210" y="138" fill="#9d9d9d">#252526</text>
    <rect x="360" y="80" width="150" height="70" fill="#3c3c3c"/><text x="370" y="102" fill="#cccccc">border</text><text x="370" y="120" fill="#9d9d9d">panel.border</text><text x="370" y="138" fill="#9d9d9d">#3c3c3c</text>
    <rect x="520" y="80" width="150" height="70" fill="#0e639c"/><text x="530" y="102" fill="#ffffff">accent</text><text x="530" y="120" fill="#dceefc">button.background</text><text x="530" y="138" fill="#dceefc">#0e639c</text>
    <rect x="680" y="80" width="150" height="70" fill="#181818" stroke="#3794ff"/><text x="690" y="102" fill="#3794ff">accent.link</text><text x="690" y="120" fill="#9d9d9d">textLink.foreground</text><text x="690" y="138" fill="#9d9d9d">#3794ff</text>
    <rect x="840" y="80" width="150" height="70" fill="#3c3c3c"/><rect x="912" y="80" width="78" height="70" fill="#181818"/><text x="850" y="102" fill="#cccccc">foreground</text><text x="850" y="120" fill="#9d9d9d">foreground</text><text x="850" y="138" fill="#9d9d9d">#cccccc</text>

    <!-- row 2: status -->
    <rect x="40" y="170" width="150" height="70" fill="#e2c08d"/><text x="50" y="192" fill="#1e1e1e" font-weight="600">status.mod</text><text x="50" y="210" fill="#3d3323">gitDecoration.modified…</text><text x="50" y="228" fill="#3d3323">#e2c08d ≠ 值不同</text>
    <rect x="200" y="170" width="150" height="70" fill="#d18616"/><text x="210" y="192" fill="#1e1e1e" font-weight="600">status.type</text><text x="210" y="210" fill="#3d2508">charts.orange</text><text x="210" y="228" fill="#3d2508">#d18616 ⇄ 类型不同</text>
    <rect x="360" y="170" width="150" height="70" fill="#c74e39"/><text x="370" y="192" fill="#ffffff" font-weight="600">status.onlya</text><text x="370" y="210" fill="#f6dad5">gitDecoration.deleted…</text><text x="370" y="228" fill="#f6dad5">#c74e39 − 仅在 A</text>
    <rect x="520" y="170" width="150" height="70" fill="#81b88b"/><text x="530" y="192" fill="#1e1e1e" font-weight="600">status.onlyb</text><text x="530" y="210" fill="#20362b">gitDecoration.added…</text><text x="530" y="228" fill="#20362b">#81b88b + 仅在 B</text>
    <rect x="680" y="170" width="150" height="70" fill="#b180d7"/><text x="690" y="192" fill="#1e1e1e" font-weight="600">status.equ</text><text x="690" y="210" fill="#332244">charts.purple</text><text x="690" y="228" fill="#332244">#b180d7 ≈ 规则等价</text>
    <rect x="840" y="170" width="150" height="70" fill="#9d9d9d"/><text x="850" y="192" fill="#1e1e1e" font-weight="600">status.ign</text><text x="850" y="210" fill="#2c2c2c">disabledForeground</text><text x="850" y="228" fill="#2c2c2c">#9d9d9d ⊘ 已忽略</text>

    <!-- row 3: err + diffs -->
    <rect x="40" y="260" width="150" height="70" fill="#f14c4c"/><text x="50" y="282" fill="#ffffff" font-weight="600">status.err</text><text x="50" y="300" fill="#ffd9d9">editorError.foreground</text><text x="50" y="318" fill="#ffd9d9">#f14c4c ⚠ 解析失败</text>
    <rect x="200" y="260" width="150" height="70" fill="#1e1e1e"/><rect x="210" y="286" width="130" height="28" fill="rgba(89,168,105,0.18)" stroke="#81b88b"/><text x="210" y="322" fill="#9d9d9d">diff.insBg · inserted…</text>
    <rect x="360" y="260" width="150" height="70" fill="#1e1e1e"/><rect x="370" y="286" width="130" height="28" fill="rgba(240,113,120,0.14)" stroke="#e0704f"/><text x="370" y="322" fill="#9d9d9d">diff.remBg · removed…</text>
    <rect x="520" y="260" width="150" height="70" fill="#1e1e1e"/><rect x="530" y="286" width="130" height="28" fill="rgba(177,128,215,0.16)" stroke="#b180d7"/><text x="530" y="322" fill="#9d9d9d">diff.equBg · 紫(equ 专用)</text>
    <rect x="680" y="260" width="150" height="70" fill="#1e1e1e"/><rect x="690" y="286" width="130" height="28" fill="#262626" stroke="#454545"/><text x="690" y="322" fill="#9d9d9d">diff.ignBg · 中性弱化</text>
    <rect x="840" y="260" width="150" height="70" fill="#1e1e1e"/><rect x="850" y="286" width="130" height="28" fill="#3a2f14" stroke="#6b5a1e"/><text x="850" y="322" fill="#9d9d9d">staleBanner · 过期黄条</text>

    <!-- row 4: code colors -->
    <rect x="40" y="350" width="150" height="70" fill="#1e1e1e" stroke="#3c3c3c"/><rect x="50" y="360" width="130" height="22" fill="#1e1e1e"/><text x="54" y="375" fill="#6a9955" font-family="Consolas">// comment</text><text x="50" y="402" fill="#9d9d9d">code.comment · 注释行</text>
    <rect x="200" y="350" width="150" height="70" fill="#1e1e1e" stroke="#3c3c3c"/><rect x="210" y="360" width="130" height="22" fill="#1e1e1e"/><text x="214" y="375" fill="#569cd6" font-family="Consolas">keyword</text><text x="210" y="402" fill="#9d9d9d">code.keyword</text>
    <rect x="360" y="350" width="150" height="70" fill="#1e1e1e" stroke="#3c3c3c"/><rect x="370" y="360" width="130" height="22" fill="#1e1e1e"/><text x="374" y="375" fill="#ce9178" font-family="Consolas">"string"</text><text x="370" y="402" fill="#9d9d9d">code.string</text>
    <rect x="520" y="350" width="150" height="70" fill="#1e1e1e" stroke="#3c3c3c"/><rect x="530" y="360" width="130" height="22" fill="#1e1e1e"/><text x="534" y="375" fill="#b5cea8" font-family="Consolas">2048</text><text x="530" y="402" fill="#9d9d9d">code.number</text>
    <rect x="680" y="350" width="150" height="70" fill="#252526" stroke="#3c3c3c"/><text x="690" y="372" fill="#cccccc">input.background</text><text x="690" y="390" fill="#9d9d9d">input.background</text><text x="690" y="408" fill="#9d9d9d">#3c3c3c</text>
    <rect x="840" y="350" width="150" height="70" fill="#04395e" stroke="#3c3c3c"/><text x="850" y="372" fill="#ffffff">list.active(选中)</text><text x="850" y="390" fill="#c8ddff">list.activeSelection…</text><text x="850" y="408" fill="#c8ddff">#04395e</text>
  </g>

  <rect x="40" y="440" width="1020" height="1" fill="#3c3c3c"/>
  <g font-size="11.5" fill="#cccccc">
    <text x="40" y="466">用法红线(INV-1):</text>
    <text x="40" y="488">· Webview 内一律 var(--vscode-…);树/徽标用 ThemeColor(id);禁止新 hex。</text>
    <text x="40" y="510">· 状态色语义互斥:equ(紫)不许挪作他用;err 只给解析失败,不给"警告级差异"。</text>
    <text x="40" y="532">· 透明度变化(如 diff 底色叠行底)保持可读:文字对比 ≥ 4.5:1,与底色对比 ≥ 3:1。</text>
    <text x="40" y="554">· 新增颜色:查 01 §五角色表 → 无匹配 → 决策日志申请角色 → 设计补 3 主题值 → 使用。</text>
    <text x="40" y="576" fill="#9d9d9d">本图为 Dark+ 参考值。Light+ 见 10 号图,High Contrast 见 11 号图;三者角色集合完全一致,仅取值不同。</text>
  </g>
</svg>
