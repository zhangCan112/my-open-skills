<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" font-family="Segoe UI, PingFang SC, sans-serif">
  <rect width="1100" height="620" fill="#181818"/>
  <text x="24" y="34" fill="#ffffff" font-size="16" font-weight="600">07 · 规则视图解剖(侧栏常驻视图)</text>
  <text x="24" y="54" fill="#9d9d9d" font-size="12">查看与开关的常驻面;「添加」落点为向导(C8)。规则行 = 类型徽标 + 人话句 + 开关。</text>

  <!-- rule row anatomy -->
  <rect x="40" y="76" width="1020" height="44" fill="#252526"/>
  <text x="56" y="103" fill="#b180d7" font-size="11">≈ 值等价</text>
  <text x="130" y="102" fill="#cccccc" font-size="12">当 键 <tspan font-family="Consolas" fill="#e7e7e7">cache.redis.host</tspan> 且 A 值 <tspan font-family="Consolas" fill="#e7e7e7">redis-dev.local</tspan> 且 B 值 <tspan font-family="Consolas" fill="#e7e7e7">redis-prod.internal</tspan> → <tspan fill="#b180d7" font-weight="600">视为等价</tspan></text>
  <rect x="1004" y="90" width="32" height="17" rx="9" fill="#2ea043"/><circle cx="1019" cy="98.5" r="6.5" fill="#ffffff"/>
  <g font-size="10" fill="#ffd43b">
    <text x="56" y="140">类型徽标:4 类(配对 #81b88b / 等价 #b180d7 / 忽略 #9d9d9d / 脚本 #569cd6)· 三重编码同样适用(INV-2)</text>
    <text x="56" y="158">句子文法:当 &lt;条件&gt;… → &lt;结论&gt;;条件值等宽徽章;结论动词着色(C7 文法表)</text>
    <text x="56" y="176">开关:32×17,轨道圆角 9,圆点 13;on = 正绿;hover 显示 ✎ 🗑;焦点环 1px focusBorder(INV-8)</text>
    <text x="56" y="194">行高 36;整行可点 = 切换开关;右键菜单:编辑(表单)· 删除</text>
  </g>
  <rect x="40" y="210" width="1020" height="1" fill="#3c3c3c"/>

  <!-- all four types -->
  <g font-size="12" fill="#cccccc">
    <rect x="40" y="224" width="1020" height="36" fill="#252526"/>
    <text x="56" y="247" fill="#81b88b" font-size="11">⇄ 文件配对</text>
    <text x="130" y="246">A 侧 <tspan font-family="Consolas" fill="#e7e7e7">.env.dev</tspan> ⇄ B 侧 <tspan font-family="Consolas" fill="#e7e7e7">.env.prod.example</tspan> → <tspan fill="#81b88b" font-weight="600">配对比较</tspan></text>
    <rect x="1004" y="234" width="32" height="17" rx="9" fill="#2ea043"/><circle cx="1019" cy="242.5" r="6.5" fill="#fff"/>

    <rect x="40" y="260" width="1020" height="36" fill="#1e1e1e"/>
    <text x="56" y="283" fill="#b180d7" font-size="11">≈ 值等价</text>
    <text x="130" y="282">当 A 值 <tspan font-family="Consolas" fill="#e7e7e7">""</tspan> 且 B 值 <tspan font-family="Consolas" fill="#e7e7e7">null</tspan> → <tspan fill="#b180d7" font-weight="600">视为等价</tspan></text>
    <rect x="1004" y="270" width="32" height="17" rx="9" fill="#2ea043"/><circle cx="1019" cy="278.5" r="6.5" fill="#fff"/>

    <rect x="40" y="296" width="1020" height="36" fill="#252526"/>
    <text x="56" y="319" fill="#9d9d9d" font-size="11">⊘ 忽略</text>
    <text x="130" y="318">当 键匹配 <tspan font-family="Consolas" fill="#e7e7e7">logging.file.*</tspan> → <tspan fill="#9d9d9d" font-weight="600">跳过比较(不计入差异)</tspan></text>
    <rect x="1004" y="306" width="32" height="17" rx="9" fill="#2ea043"/><circle cx="1019" cy="314.5" r="6.5" fill="#fff"/>

    <rect x="40" y="332" width="1020" height="36" fill="#1e1e1e"/>
    <text x="56" y="355" fill="#569cd6" font-size="11">ƒ 脚本</text>
    <text x="130" y="354">对每对键值调用 <tspan font-family="Consolas" fill="#e7e7e7">rules/env-normalizer.js</tspan> → <tspan fill="#569cd6" font-weight="600">由脚本返回 equal / different / ignore</tspan></text>
    <rect x="880" y="344" width="66" height="16" rx="8" fill="none" stroke="#81b88b"/><text x="913" y="356" fill="#81b88b" font-size="9.5" text-anchor="middle">✓ 已验证</text>
    <rect x="1004" y="342" width="32" height="17" rx="9" fill="#2ea043"/><circle cx="1019" cy="350.5" r="6.5" fill="#fff"/>
  </g>

  <!-- invalid rule demo -->
  <rect x="40" y="384" width="1020" height="52" fill="#252526" stroke="#f14c4c"/>
  <text x="56" y="408" fill="#f14c4c" font-size="11">⚠ Schema 校验失败</text>
  <text x="180" y="408" fill="#9d9d9d" font-size="12" font-style="italic">"values" 与 "coerce" 不能同时设置 —— 无效规则不生效、不出现在本列表(Webview 编辑器中标红)</text>
  <text x="56" y="428" fill="#9d9d9d" font-size="10.5">INV-4:运行中的规则永远可信;校验由 rules.schema.json 驱动</text>

  <!-- footer actions -->
  <rect x="40" y="452" width="1020" height="1" fill="#3c3c3c"/>
  <rect x="40" y="468" width="150" height="24" rx="3" fill="#0e639c"/><text x="115" y="484" fill="#fff" font-size="12" text-anchor="middle">+ 添加规则…</text>
  <rect x="200" y="468" width="130" height="24" rx="3" fill="none" stroke="#454545"/><text x="265" y="484" fill="#ccc" font-size="12" text-anchor="middle">&lt;/&gt; 编辑源码</text>
  <text x="350" y="484" fill="#9d9d9d" font-size="11">脚部常驻动作;「编辑源码」打开 rules.json(带 Schema 关联 → 补全/校验)</text>

  <!-- states -->
  <g font-size="10" fill="#ffd43b">
    <text x="40" y="530">边界:规则文件不存在 → Welcome 按钮「创建规则文件」;JSON 语法错 → 顶部错误条 + 用上次有效规则(E16);文件配对规则由第 2 步选择自动生成,标「向导中创建」不可关。</text>
    <text x="40" y="552">数据契约:见 schema/rules.schema.json;卡片句由 Schema 字段生成(INV-9:Schema 是契约,界面自动跟随)。</text>
    <text x="40" y="574">排序 = rules.json 书写顺序 = 判定优先级(首个命中生效,ignore &gt; equ);拖拽排序二期。</text>
  </g>
</svg>
