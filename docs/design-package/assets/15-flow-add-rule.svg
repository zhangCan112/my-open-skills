<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" font-family="Segoe UI, PingFang SC, sans-serif">
  <rect width="1100" height="560" fill="#181818"/>
  <text x="24" y="34" fill="#ffffff" font-size="16" font-weight="600">15 · 添加规则流程 — 双入口收敛到同一向导</text>
  <text x="24" y="54" fill="#9d9d9d" font-size="12">入口①规则中心(主动配置)②结果行内(最常用,带上下文预填)。命令面板不作为入口(INV-10)。</text>

  <!-- entrance 1 -->
  <rect x="50" y="90" width="240" height="120" rx="6" fill="#252526" stroke="#3c3c3c"/>
  <text x="170" y="114" fill="#e7e7e7" font-size="12" font-weight="600" text-anchor="middle">入口① 规则中心</text>
  <g font-size="11" fill="#cccccc">
    <text x="66" y="138">· 侧栏规则视图「+ 添加规则…」</text>
    <text x="66" y="158">· 侧栏规则视图脚部「编辑源码」</text>
    <text x="66" y="178" fill="#9d9d9d">适合:主动配置、批量查看</text>
  </g>
  <path d="M170 210 v40" stroke="#3794ff"/><polygon points="170,252 166,244 174,244" fill="#3794ff"/>

  <!-- entrance 2 -->
  <rect x="330" y="90" width="280" height="120" rx="6" fill="#252526" stroke="#3c3c3c"/>
  <text x="470" y="114" fill="#e7e7e7" font-size="12" font-weight="600" text-anchor="middle">入口② 结果行内(最常用)</text>
  <g font-size="11" fill="#cccccc">
    <text x="346" y="138">· 报告行「≈ 设为等价」(仅 mod 行)</text>
    <text x="346" y="158">· 树/报告「⊘ 忽略此键」</text>
    <text x="346" y="178" fill="#9d9d9d">适合:看到差异顺手沉淀;上下文预填</text>
  </g>
  <path d="M470 210 v40" stroke="#3794ff"/><polygon points="470,252 466,244 474,244" fill="#3794ff"/>

  <!-- convergence -->
  <rect x="200" y="256" width="700" height="56" rx="6" fill="#2a2313" stroke="#6b5a1e"/>
  <text x="550" y="279" fill="#ffd97a" font-size="12" text-anchor="middle" font-weight="600">同一向导(QuickPick + InputBox,Esc 全程可退,不落盘)</text>
  <text x="550" y="299" fill="#ffd97a" font-size="11" text-anchor="middle">入口② 自动预填:键路径 / 两侧值;入口① 从空白开始</text>

  <!-- wizard steps -->
  <path d="M550 312 v26" stroke="#3794ff"/><polygon points="550,340 546,332 554,332" fill="#3794ff"/>
  <g font-size="11.5" fill="#cccccc">
    <rect x="60" y="344" width="240" height="90" rx="6" fill="#252526" stroke="#3c3c3c"/>
    <text x="180" y="366" fill="#e7e7e7" text-anchor="middle" font-weight="600">步骤 1 · 选类型(QuickPick)</text>
    <text x="76" y="388">分隔线:简单规则 / 进阶·JS</text>
    <text x="76" y="408">文件配对 · 值等价 · 忽略 · 脚本</text>
    <text x="76" y="426" fill="#9d9d9d">默认悬停「值等价」</text>

    <rect x="330" y="344" width="240" height="90" rx="6" fill="#252526" stroke="#3c3c3c"/>
    <text x="450" y="366" fill="#e7e7e7" text-anchor="middle" font-weight="600">步骤 2..n · InputBox 逐项</text>
    <text x="346" y="388">值等价:A 值 → B 值 → 范围(可跳)</text>
    <text x="346" y="408">忽略:glob → 确认 · 配对:左 → 右</text>
    <text x="346" y="426" fill="#9d9d9d">每步即时校验(glob 语法等)</text>

    <rect x="600" y="344" width="240" height="90" rx="6" fill="#252526" stroke="#3c3c3c"/>
    <text x="720" y="366" fill="#e7e7e7" text-anchor="middle" font-weight="600">脚本类:生成模板并打开</text>
    <text x="616" y="388">rules/&lt;name&gt;.js + JSDoc 骨架</text>
    <text x="616" y="408">保存即试运行:equal/diff/ignore 计数</text>
    <text x="616" y="426" fill="#9d9d9d">错误以诊断(红线)呈现</text>
  </g>

  <!-- outcome -->
  <path d="M550 434 v26" stroke="#3794ff"/><polygon points="550,462 546,454 554,454" fill="#3794ff"/>
  <rect x="200" y="466" width="700" height="56" rx="6" fill="#252526" stroke="#3c3c3c"/>
  <g font-size="11.5" fill="#cccccc">
    <text x="550" y="488" text-anchor="middle" font-weight="600" fill="#e7e7e7">落盘 rules.json → 自动重比较 → 通知「规则已生效(撤销)」</text>
    <text x="550" y="508" text-anchor="middle" fill="#9d9d9d">受影响键 flash 1.6s;规则视图勾选态同步;撤销 = 移除该规则(10s 内)</text>
  </g>
  <text x="24" y="548" fill="#9d9d9d" font-size="11">INV-4 自查:这条流程里,结果可见(≈/⊘)✓ · 可开关(规则视图)✓ · 可审计(rules.json)✓。</text>
</svg>
