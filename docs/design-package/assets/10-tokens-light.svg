<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" font-family="Segoe UI, PingFang SC, sans-serif">
  <rect width="1100" height="560" fill="#f3f3f3"/>
  <text x="24" y="34" fill="#1b1b1b" font-size="16" font-weight="600">10 · 色板 — Light+(实现绑定 --vscode-*,INV-1)</text>
  <text x="24" y="54" fill="#717171" font-size="12">角色集合与 Dark+ 完全一致;仅取值不同。验证点:状态色在白底上的对比度 ≥ 3:1。</text>
  <g font-size="11">
    <rect x="40" y="80" width="150" height="70" fill="#ffffff" stroke="#e0e0e0"/><text x="50" y="102" fill="#3b3b3b">editor.background</text><text x="50" y="120" fill="#717171">#ffffff</text>
    <rect x="200" y="80" width="150" height="70" fill="#f3f3f3" stroke="#e0e0e0"/><text x="210" y="102" fill="#3b3b3b">side.background</text><text x="210" y="120" fill="#717171">#f3f3f3</text>
    <rect x="360" y="80" width="150" height="70" fill="#e0e0e0"/><text x="370" y="102" fill="#3b3b3b">border #e0e0e0</text>
    <rect x="520" y="80" width="150" height="70" fill="#007acc"/><text x="530" y="102" fill="#ffffff">accent #007acc</text>
    <rect x="680" y="80" width="150" height="70" fill="#ffffff" stroke="#006ab1"/><text x="690" y="102" fill="#006ab1">accent.link</text>
    <rect x="840" y="80" width="150" height="70" fill="#ffffff" stroke="#e0e0e0"/><text x="850" y="102" fill="#3b3b3b">foreground #3b3b3b</text>

    <rect x="40" y="170" width="150" height="70" fill="#895503"/><text x="50" y="192" fill="#ffffff" font-weight="600">status.mod</text><text x="50" y="210" fill="#ffe9d0">#895503 ≠</text>
    <rect x="200" y="170" width="150" height="70" fill="#d18616"/><text x="210" y="192" fill="#ffffff" font-weight="600">status.type</text><text x="210" y="210" fill="#fff3e0">#d18616 ⇄</text>
    <rect x="360" y="170" width="150" height="70" fill="#ad0707"/><text x="370" y="192" fill="#ffffff" font-weight="600">status.onlya</text><text x="370" y="210" fill="#ffdad9">#ad0707 −</text>
    <rect x="520" y="170" width="150" height="70" fill="#587c0c"/><text x="530" y="192" fill="#ffffff" font-weight="600">status.onlyb</text><text x="530" y="210" fill="#eaf6dc">#587c0c +</text>
    <rect x="680" y="170" width="150" height="70" fill="#6953d1"/><text x="690" y="192" fill="#ffffff" font-weight="600">status.equ</text><text x="690" y="210" fill="#e8e4ff">#6953d1 ≈</text>
    <rect x="840" y="170" width="150" height="70" fill="#717171"/><text x="850" y="192" fill="#ffffff" font-weight="600">status.ign</text><text x="850" y="210" fill="#f0f0f0">#717171 ⊘</text>

    <rect x="40" y="260" width="150" height="70" fill="#e51400"/><text x="50" y="282" fill="#ffffff" font-weight="600">status.err</text><text x="50" y="300" fill="#ffdad9">#e51400 ⚠</text>
    <rect x="200" y="260" width="150" height="70" fill="#ffffff"/><rect x="210" y="286" width="130" height="28" fill="rgba(155,185,85,0.28)" stroke="#587c0c"/><text x="210" y="322" fill="#717171">diff.insBg</text>
    <rect x="360" y="260" width="150" height="70" fill="#ffffff"/><rect x="370" y="286" width="130" height="28" fill="rgba(255,0,0,0.10)" stroke="#ad0707"/><text x="370" y="322" fill="#717171">diff.remBg</text>
    <rect x="520" y="260" width="150" height="70" fill="#ffffff"/><rect x="530" y="286" width="130" height="28" fill="rgba(105,83,209,0.12)" stroke="#6953d1"/><text x="530" y="322" fill="#717171">diff.equBg</text>
    <rect x="680" y="260" width="150" height="70" fill="#ffffff" stroke="#cecece"/><text x="690" y="292" fill="#3b3b3b">input.background</text><text x="690" y="310" fill="#717171">#ffffff / border #cecece</text>
    <rect x="840" y="260" width="150" height="70" fill="#0060c0"/><text x="850" y="292" fill="#ffffff">list.active(选中)</text><text x="850" y="310" fill="#d6e8ff">#0060c0,文字白</text>
  </g>
  <rect x="40" y="360" width="1020" height="1" fill="#d8d8d8"/>
  <g font-size="11.5" fill="#3b3b3b">
    <text x="40" y="386">Light+ 特有注意:</text>
    <text x="40" y="410">· 黄色系(status.mod 棕、stale 黄)在白底上偏弱 → 允许在徽标描边加深一档,但仍用 token(可申请角色如 status.modStrong)。</text>
    <text x="40" y="434">· diff 底色透明度普遍比暗色高一档(白底需要更重的着色才可感知)。</text>
    <text x="40" y="458">· 阴影禁用(改用 1px 边框分层);hover 底 #e8e8e8。</text>
    <text x="40" y="482" fill="#717171">验证:截图放入灰度滤镜,六态仍可区分(靠图标+文字,INV-2)。</text>
  </g>
</svg>
