<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" font-family="Segoe UI, PingFang SC, sans-serif">
  <rect width="1100" height="640" fill="#181818"/>
  <text x="24" y="34" fill="#ffffff" font-size="16" font-weight="600">06 · 对比报告表格解剖(Webview,二期 P1)</text>
  <text x="24" y="54" fill="#9d9d9d" font-size="12">列宽:状态 96 / 键 ≥240 / 文件 96 / A ≥220 / B ≥220 / 操作 96;行高 28;≥1000 行虚拟化(INV-7)。</text>

  <!-- toolbar -->
  <rect x="40" y="76" width="1020" height="40" fill="#252526"/>
  <rect x="52" y="86" width="132" height="20" rx="10" fill="none" stroke="#454545"/>
  <text x="118" y="100" fill="#cccccc" font-size="11" text-anchor="middle">📄 全部文件 ▾</text>
  <rect x="196" y="86" width="70" height="20" rx="10" fill="#0e639c"/>
  <text x="231" y="100" fill="#ffffff" font-size="11" text-anchor="middle">全部 14</text>
  <rect x="274" y="86" width="80" height="20" rx="10" fill="none" stroke="#454545"/>
  <text x="314" y="100" fill="#cccccc" font-size="11" text-anchor="middle">≠ 值不同 6</text>
  <rect x="362" y="86" width="70" height="20" rx="10" fill="none" stroke="#454545"/>
  <text x="397" y="100" fill="#cccccc" font-size="11" text-anchor="middle">⇄ 类型 2</text>
  <rect x="440" y="86" width="76" height="20" rx="10" fill="none" stroke="#454545"/>
  <text x="478" y="100" fill="#cccccc" font-size="11" text-anchor="middle">− 仅A 3</text>
  <rect x="524" y="86" width="76" height="20" rx="10" fill="none" stroke="#454545"/>
  <text x="562" y="100" fill="#cccccc" font-size="11" text-anchor="middle">+ 仅B 3</text>
  <rect x="608" y="86" width="84" height="20" rx="10" fill="none" stroke="#454545"/>
  <text x="650" y="100" fill="#cccccc" font-size="11" text-anchor="middle">≈ 等价 1</text>
  <rect x="700" y="86" width="76" height="20" rx="10" fill="none" stroke="#454545"/>
  <text x="738" y="100" fill="#cccccc" font-size="11" text-anchor="middle">⊘ 忽略 2</text>
  <rect x="788" y="86" width="98" height="20" rx="10" fill="none" stroke="#454545" stroke-dasharray="3 2"/>
  <text x="837" y="100" fill="#cccccc" font-size="11" text-anchor="middle">✓ 显示一致 87</text>
  <rect x="900" y="86" width="70" height="20" rx="10" fill="#0e639c"/>
  <text x="935" y="100" fill="#ffffff" font-size="11" text-anchor="middle">⚙ 规则 4/6</text>
  <rect x="982" y="88" width="66" height="17" fill="#3c3c3c"/>
  <text x="990" y="100" fill="#9d9d9d" font-size="10">🔍 搜索…</text>

  <!-- rules drawer -->
  <rect x="40" y="116" width="1020" height="56" fill="#252526"/>
  <text x="52" y="134" fill="#9d9d9d" font-size="10.5">开关立即影响下方表格(试试关掉 Redis 主机等价):</text>
  <rect x="52" y="142" width="16" height="9" rx="5" fill="#2ea043"/><circle cx="63" cy="146.5" r="3.5" fill="#fff"/>
  <text x="76" y="150" fill="#cccccc" font-size="11">≈ 值等价 · Redis 主机映射</text>
  <rect x="320" y="142" width="16" height="9" rx="5" fill="#2ea043"/><circle cx="331" cy="146.5" r="3.5" fill="#fff"/>
  <text x="344" y="150" fill="#cccccc" font-size="11">⊘ 忽略 · logging.file.*</text>
  <rect x="560" y="144" width="110" height="16" rx="3" fill="#0e639c"/><text x="615" y="156" fill="#fff" font-size="10" text-anchor="middle">+ 添加规则(向导)</text>
  <rect x="40" y="172" width="1020" height="1" fill="#3c3c3c"/>

  <!-- table header -->
  <g font-size="11" fill="#9d9d9d">
    <text x="52" y="192">状态</text><text x="160" y="192">键路径</text><text x="420" y="192">文件</text><text x="530" y="192">A · order-service</text><text x="790" y="192">B · order-service-template</text><text x="1024" y="192" text-anchor="end">操作 ④</text>
  </g>
  <rect x="40" y="200" width="1020" height="1" fill="#3c3c3c"/>

  <!-- rows -->
  <g font-size="12">
    <rect x="40" y="204" width="1020" height="28" fill="#1e1e1e"/>
    <text x="52" y="223"><tspan fill="#e2c08d">≠ 值不同</tspan></text>
    <text x="160" y="223" class="mono" fill="#e7e7e7"><tspan fill="#9d9d9d">server.</tspan>port</text>
    <text x="420" y="223" fill="#9d9d9d">application.yaml</text>
    <text x="530" y="223">8080</text><text x="790" y="223">8081</text>
    <text x="1010" y="223" fill="#9d9d9d">≈ ⧉ ⊙ ⊘</text>

    <rect x="40" y="232" width="1020" height="28" fill="#2a2d2e"/>
    <text x="52" y="251"><tspan fill="#d18616">⇄ 类型不同</tspan></text>
    <text x="160" y="251" fill="#e7e7e7"><tspan fill="#9d9d9d">database.pool.</tspan>maxSize</text>
    <text x="420" y="251" fill="#9d9d9d">application.yaml</text>
    <text x="530" y="251">20</text><text x="790" y="251">"20"</text>
    <text x="1010" y="251" fill="#9d9d9d">⧉ ⊙ ⊘</text>
    <!-- expanded -->
    <rect x="40" y="260" width="1020" height="88" fill="#252526"/>
    <rect x="52" y="270" width="480" height="66" fill="#1e1e1e" stroke="#3c3c3c"/>
    <text x="62" y="286" fill="#9d9d9d" font-size="10">A · order-service</text>
    <text x="62" y="308" font-family="Consolas" font-size="12" fill="#cccccc">maxSize: 20</text>
    <rect x="548" y="270" width="480" height="66" fill="#1e1e1e" stroke="#3c3c3c"/>
    <text x="558" y="286" fill="#9d9d9d" font-size="10">B · order-service-template</text>
    <text x="558" y="308" font-family="Consolas" font-size="12" fill="#cccccc">maxSize: "20"</text>
    <text x="52" y="344" fill="#ffd43b" font-size="10">展开行(手风琴,同时仅一行):两侧值并排 + 规则命中 + 行动作;▾ 转向 ↑</text>

    <rect x="40" y="348" width="1020" height="28" fill="#1e1e1e"/>
    <text x="52" y="367"><tspan fill="#e0704f">− 仅在 A</tspan></text>
    <text x="160" y="367" fill="#e7e7e7">database.pool.minIdle</text>
    <text x="420" y="367" fill="#9d9d9d">application.yaml</text>
    <text x="530" y="367">5</text><text x="790" y="367" fill="#9d9d9d" font-style="italic">— 不存在 —</text>
    <text x="1010" y="367" fill="#9d9d9d">⧉ ⊙ ⊘</text>

    <rect x="40" y="376" width="1020" height="28" fill="#1e1e1e"/>
    <text x="52" y="395"><tspan fill="#b180d7">≈ 规则等价</tspan></text>
    <text x="160" y="395" fill="#e7e7e7">cache.redis.host</text>
    <text x="420" y="395" fill="#9d9d9d">application.yaml</text>
    <text x="530" y="395" fill="#9d9d9d">redis-dev.local</text><text x="790" y="395" fill="#9d9d9d">redis-prod.internal</text>
    <text x="1010" y="395" fill="#9d9d9d">⧉ ⊙</text>
  </g>

  <!-- footer meta -->
  <rect x="40" y="420" width="1020" height="24" fill="#252526"/>
  <text x="52" y="436" fill="#9d9d9d" font-size="10.5">共 104 个键 · 14 处差异 · 1 项规则等价 · 2 项已忽略 · 比较于 14:32 · 已启用虚拟滚动(5000 行上限)</text>

  <g font-size="10" fill="#ffd43b">
    <text x="40" y="470">① 芯片计数来自 DiffResult.stats;规则开关后随 eff 重算(INV-3)</text>
    <text x="40" y="488">② 虚线芯片 = 显式开关(一致项默认隐藏);选中态 = button.background</text>
    <text x="40" y="506">③ 行高 28;hover list.hoverBackground;展开行同时仅一行;Esc 收起</text>
    <text x="40" y="524">④ 操作列:≈(仅 mod 行)· ⧉ 打开 diff · ⊙ 树中定位 · ⊘/↺ 忽略切换;规则类动作写回 rules.json 并通知可撤销</text>
    <text x="40" y="542">⑤ 底部元信息行:总数/差异/等价/忽略/时间/虚拟化提示,数字同源</text>
    <text x="40" y="560">⑥ 无障碍:过滤框 ↑↓ 进列表;行 role=button + aria-expanded;全部色走 tokens</text>
    <text x="40" y="590" fill="#9d9d9d">实现:CSP default-src 'none';状态存 getState;HTML 转义一切用户输入;DocumentFragment 单次插入。</text>
  </g>
</svg>
