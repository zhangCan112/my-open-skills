<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700" font-family="Segoe UI, PingFang SC, sans-serif">
  <rect width="1100" height="700" fill="#181818"/>
  <text x="24" y="34" fill="#ffffff" font-size="16" font-weight="600">03 · 树行解剖 — 四种行类型(行高 22px)</text>
  <text x="24" y="54" fill="#9d9d9d" font-size="12">缩进 8px/级;图标 16px;标签 13px;描述右对齐灰字;计数徽标 16px 高。每行 ≤2 个行内动作(hover 才出现)。</text>

  <!-- scale ruler -->
  <g stroke="#3c3c3c"><path d="M80 80 v620"/><path d="M80 96 h1000"/><path d="M80 118 h1000"/></g>
  <text x="84" y="92" fill="#ffd43b" font-size="10">22px 行高</text>

  <!-- row 1: file pair -->
  <rect x="80" y="96" width="1000" height="22" fill="#2d2d2d"/>
  <text x="90" y="111" fill="#9d9d9d" font-size="10">▾</text>
  <text x="110" y="111" fill="#e2c08d" font-size="12">⚙</text>
  <text x="132" y="111" fill="#cccccc" font-size="13" font-weight="600">application.yaml</text>
  <text x="1068" y="111" fill="#9d9d9d" font-size="11" text-anchor="end">12</text>
  <g stroke="#ffd43b" fill="none">
    <path d="M88 118 v8"/><path d="M106 122 h0"/><path d="M88 126 h18"/>
  </g>
  <g font-size="10" fill="#ffd43b">
    <text x="90" y="140">chevron 12px</text>
    <text x="112" y="140">文件图标 16(按扩展名配色)</text>
    <text x="330" y="140">标签 13px / 600</text>
    <text x="1068" y="140" text-anchor="end">计数 = 活跃差异(desc 或 badge)</text>
  </g>

  <!-- row 2: status -->
  <rect x="88" y="160" width="992" height="22" fill="#252526"/>
  <text x="98" y="175" fill="#9d9d9d" font-size="10">▾</text>
  <text x="118" y="175" fill="#e2c08d" font-size="12" font-weight="700">≠</text>
  <text x="140" y="175" fill="#cccccc" font-size="13">值不同</text>
  <text x="1072" y="175" fill="#9d9d9d" font-size="11" text-anchor="end">4</text>
  <g font-size="10" fill="#ffd43b">
    <text x="98" y="196">缩进 8px/级(此行 1 级)</text>
    <text x="120" y="196">状态图标 = codicon + 状态色(INV-2)</text>
    <text x="300" y="196">右侧计数;点击折叠/展开</text>
  </g>

  <!-- row 3: key group -->
  <rect x="96" y="224" width="984" height="22" fill="#252526"/>
  <text x="106" y="239" fill="#9d9d9d" font-size="10">▾</text>
  <text x="126" y="239" fill="#cccccc" font-size="13">pool</text>
  <text x="1072" y="239" fill="#9d9d9d" font-size="11" text-anchor="end">2</text>
  <text x="106" y="258" fill="#ffd43b" font-size="10">键分组行 = 键路径的中间段,保持原始层级(INV-6),计数 = 子叶活跃数</text>

  <!-- row 4: leaf -->
  <rect x="104" y="288" width="976" height="22" fill="#252526"/>
  <text x="114" y="303" fill="#e2c08d" font-size="12" font-weight="700">≠</text>
  <text x="136" y="303" fill="#e7e7e7" font-size="13">maxSize</text>
  <g font-size="11" fill="#9d9d9d">
    <text x="1056" y="303" text-anchor="end">20 ⇄ "20"   ⧉ ⊘</text>
  </g>
  <rect x="920" y="292" width="56" height="16" fill="#37373d"/>
  <text x="926" y="303" fill="#ffd43b" font-size="9">hover 时</text>
  <g font-size="10" fill="#ffd43b">
    <text x="114" y="324">叶子:状态图标 + 键末段(13px)+ 摘要 ≤40 字符截断(title 存全值)</text>
    <text x="500" y="324">行内动作 hover 出现:⧉ 打开对比 · ⊘ 忽略(≤2 个,官方红线)</text>
    <text x="920" y="340">hover 底 #37373d</text>
  </g>

  <!-- summary table -->
  <rect x="80" y="360" width="1000" height="1" fill="#3c3c3c"/>
  <text x="24" y="386" fill="#ffffff" font-size="14" font-weight="600">行类型规格表</text>
  <g font-size="12" fill="#cccccc">
    <text x="80" y="412" fill="#9d9d9d">行类型</text><text x="240" y="412" fill="#9d9d9d">图标</text><text x="420" y="412" fill="#9d9d9d">标签</text><text x="600" y="412" fill="#9d9d9d">描述</text><text x="780" y="412" fill="#9d9d9d">命令</text><text x="920" y="412" fill="#9d9d9d">contextValue</text>
    <text x="80" y="436">文件对</text><text x="240" y="436">文件图标(扩展名配色)</text><text x="420" y="436">文件名</text><text x="600" y="436">活跃差异数</text><text x="780" y="436">折叠</text><text x="920" y="436">file-pair</text>
    <text x="80" y="460">状态</text><text x="240" y="460">状态 codicon+色</text><text x="420" y="460">状态名</text><text x="600" y="460">组计数</text><text x="780" y="460">折叠</text><text x="920" y="460">status-{st}</text>
    <text x="80" y="484">键分组</text><text x="240" y="484">文件夹</text><text x="420" y="484">键段名</text><text x="600" y="484">子计数</text><text x="780" y="484">折叠</text><text x="920" y="484">key-group</text>
    <text x="80" y="508">叶子</text><text x="240" y="508">状态 codicon+色</text><text x="420" y="508">键末段</text><text x="600" y="508">单行摘要 ≤40</text><text x="780" y="508">vscode.diff</text><text x="920" y="508">leaf-{st}</text>
  </g>
  <rect x="80" y="524" width="1000" height="1" fill="#3c3c3c"/>
  <text x="24" y="550" fill="#ffffff" font-size="14" font-weight="600">摘要格式(叶子描述)</text>
  <g font-size="12" fill="#cccccc">
    <text x="80" y="574">mod:<tspan fill="#9d9d9d"> A值 → B值</tspan>    type:<tspan fill="#9d9d9d"> A值 ⇄ B值</tspan>    equ:<tspan fill="#9d9d9d"> A值 ≈ B值</tspan>    onlya:<tspan fill="#9d9d9d"> A值</tspan>    onlyb:<tspan fill="#9d9d9d"> B值</tspan>    ign:<tspan fill="#9d9d9d"> 值 + 弱化</tspan></text>
    <text x="80" y="600" fill="#9d9d9d">缺侧显示「— 不存在 —」;>40 字符 … 截断;敏感值打码(T059)</text>
  </g>
</svg>
